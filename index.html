<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Rental - Payment</title>
    <script src="https://www.paypal.com/sdk/js?client-id=ECM_vw167STnx02E2HkA4KdaJwlqS688y0hJJEKf8cvpZT9dcZJo-qi-Gh6tm-B9Q2-2KOx2E8eJnZdc"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            color: #666;
        }

        .price-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 30px;
        }

        .price-box .amount {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .price-box .description {
            font-size: 14px;
            opacity: 0.9;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-row .form-group {
            margin-bottom: 0;
        }

        #paypal-button-container {
            margin-top: 30px;
        }

        .error {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .loading {
            text-align: center;
            color: #667eea;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏠 Top Rental</h1>
            <p>Secure Payment Processing</p>
        </div>

        <div class="price-box">
            <div class="amount">$50.00</div>
            <div class="description">One-time payment</div>
        </div>

        <form id="paymentForm">
            <div class="form-group">
                <label for="firstName">First Name *</label>
                <input type="text" id="firstName" name="firstName" required>
                <div class="error" id="firstNameError">First name is required</div>
            </div>

            <div class="form-group">
                <label for="lastName">Last Name *</label>
                <input type="text" id="lastName" name="lastName" required>
                <div class="error" id="lastNameError">Last name is required</div>
            </div>

            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" name="email" required>
                <div class="error" id="emailError">Valid email is required</div>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number *</label>
                <input type="tel" id="phone" name="phone" required>
                <div class="error" id="phoneError">Phone number is required</div>
            </div>

            <div id="paypal-button-container"></div>
            <div class="loading" id="loading"><div class="spinner"></div>Processing...</div>
            <div class="success" id="success">✓ Payment successful! Thank you for your purchase.</div>
        </form>
    </div>

    <script>
        const form = document.getElementById('paymentForm');
        const loadingDiv = document.getElementById('loading');
        const successDiv = document.getElementById('success');

        function validateForm() {
            let isValid = true;

            // Validate first name
            const firstName = document.getElementById('firstName').value.trim();
            if (!firstName) {
                document.getElementById('firstNameError').style.display = 'block';
                isValid = false;
            } else {
                document.getElementById('firstNameError').style.display = 'none';
            }

            // Validate last name
            const lastName = document.getElementById('lastName').value.trim();
            if (!lastName) {
                document.getElementById('lastNameError').style.display = 'block';
                isValid = false;
            } else {
                document.getElementById('lastNameError').style.display = 'none';
            }

            // Validate email
            const email = document.getElementById('email').value.trim();
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!email || !emailRegex.test(email)) {
                document.getElementById('emailError').style.display = 'block';
                isValid = false;
            } else {
                document.getElementById('emailError').style.display = 'none';
            }

            // Validate phone
            const phone = document.getElementById('phone').value.trim();
            if (!phone) {
                document.getElementById('phoneError').style.display = 'block';
                isValid = false;
            } else {
                document.getElementById('phoneError').style.display = 'none';
            }

            return isValid;
        }

        paypal.Buttons({
            createOrder: function(data, actions) {
                if (!validateForm()) {
                    return;
                }

                return actions.order.create({
                    purchase_units: [{
                        amount: {
                            currency_code: 'USD',
                            value: '50.00'
                        },
                        description: 'Top Rental - Service Payment'
                    }]
                });
            },
            onApprove: function(data, actions) {
                loadingDiv.style.display = 'block';
                return actions.order.capture().then(function(orderData) {
                    // Collect customer info
                    const customerData = {
                        firstName: document.getElementById('firstName').value,
                        lastName: document.getElementById('lastName').value,
                        email: document.getElementById('email').value,
                        phone: document.getElementById('phone').value,
                        orderId: orderData.id,
                        timestamp: new Date().toISOString()
                    };

                    // Log the transaction (in production, send to your server)
                    console.log('Payment successful:', customerData);

                    loadingDiv.style.display = 'none';
                    form.style.display = 'none';
                    successDiv.style.display = 'block';
                });
            },
            onError: function(err) {
                loadingDiv.style.display = 'none';
                alert('An error occurred during the transaction. Please try again.');
                console.error(err);
            }
        }).render('#paypal-button-container');

        // Real-time validation
        document.getElementById('firstName').addEventListener('blur', function() {
            if (this.value.trim()) {
                document.getElementById('firstNameError').style.display = 'none';
            }
        });

        document.getElementById('lastName').addEventListener('blur', function() {
            if (this.value.trim()) {
                document.getElementById('lastNameError').style.display = 'none';
            }
        });

        document.getElementById('email').addEventListener('blur', function() {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (this.value.trim() && emailRegex.test(this.value)) {
                document.getElementById('emailError').style.display = 'none';
            }
        });

        document.getElementById('phone').addEventListener('blur', function() {
            if (this.value.trim()) {
                document.getElementById('phoneError').style.display = 'none';
            }
        });
    </script>
</body>
</html>
